<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b2f36">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Prévisite</title>
<!-- Prévisite v0.1 (13/11/2026) : capture d une visite technique sur téléphone. Tout reste dans le téléphone (IndexedDB) jusqu à l export .zip.
     AUCUNE donnée, AUCUN prix, AUCUN nom de client dans ce fichier : il est publié à une adresse publique.
     Version : changer VERSION ici ET CACHE dans sw.js. -->
<style>
:root{--bg:#f4f2ef;--pan:#fff;--line:#e2ddd6;--tx:#1f2328;--mut:#6e7781;--acc:#e8782a;--gr:#2b2f36;--wbg:#fff4e5;--ok:#17612a;--okbg:#dff3e4;--red:#b42318}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font:16px/1.4 "Segoe UI",Roboto,system-ui,sans-serif;background:#111;color:var(--tx);overscroll-behavior:none}
#app{max-width:560px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
.ebar{background:var(--gr);color:#fff;padding:12px 12px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:8px;flex:none}
.ebar b{font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ebar button{background:none;border:0;color:#fff;font-size:26px;line-height:1;cursor:pointer;padding:0 8px 2px 2px}
#etat{font-size:11px;color:#aab1ba;flex:none}
.corps{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
.pied{flex:none;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);display:flex;gap:8px}
.gros{flex:1;padding:14px 8px;border-radius:12px;border:1px solid var(--line);background:#fff;font:600 16px inherit;font-family:inherit;cursor:pointer;color:var(--tx)}
.gros.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.gros.dan{color:var(--red)}
.carte{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;cursor:pointer}
.carte .t{font-weight:600;font-size:16.5px}.carte .s{color:var(--mut);font-size:13.5px;margin-top:2px}
.onglets{display:flex;background:#fff;border-bottom:1px solid var(--line);flex:none}
.onglets button{flex:1;padding:12px 4px;border:0;background:none;font:inherit;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent}
.onglets button.on{color:var(--tx);font-weight:600;border-bottom-color:var(--acc)}
.ch{margin-bottom:13px}.ch>label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
.ch input,.ch textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;background:#fff;color:var(--tx)}
.ch textarea{resize:vertical}
.ligne{display:flex;gap:8px}.ligne>*{flex:1;min-width:0}
.mic{border:1px solid var(--line);background:#fff;border-radius:14px;padding:2px 9px;font-size:14px;cursor:pointer;margin-left:auto}
.mic.on{background:var(--red);border-color:var(--red)}
.puces{display:flex;flex-wrap:wrap;gap:6px}
.puce{padding:9px 13px;border-radius:22px;border:1px solid var(--line);background:#fff;font:inherit;font-size:15px;cursor:pointer;color:var(--tx)}
.puce.on{background:var(--gr);border-color:var(--gr);color:#fff}
.photos{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.vig{width:96px;height:96px;border-radius:10px;flex:none;border:1px solid var(--line);cursor:pointer;background:#cfc8bd;position:relative;overflow:hidden;padding:0}
.vig img{width:100%;height:100%;object-fit:cover;display:block}
.vig i{position:absolute;right:4px;bottom:4px;background:var(--acc);color:#fff;border-radius:8px;font-style:normal;font-size:11px;padding:1px 5px}
.vig.plus{background:#fff;border:2px dashed var(--acc);color:var(--acc);font:600 13px inherit;font-family:inherit}
.jauge{height:6px;background:#e7e2da;border-radius:4px;overflow:hidden;margin-top:6px}.jauge i{display:block;height:100%;background:var(--acc)}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:#eef2f6;font-weight:400}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.w{background:#fdefd3;color:#7a4a00}
.alerte{background:var(--wbg);color:#7a4a00;border-radius:10px;padding:10px;margin-bottom:10px;font-size:14px}
.alerte.r{background:#fde8e6;color:var(--red)}
.aide{font-size:12.5px;color:var(--mut)}
.vide{text-align:center;color:var(--mut);padding:40px 20px}
#toast{position:absolute;left:12px;right:12px;bottom:86px;background:var(--gr);color:#fff;padding:12px;border-radius:12px;font-size:14px;display:none;z-index:20}
#dlg{position:absolute;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:30}
#dlg .b{background:#fff;border-radius:16px;padding:16px;width:100%;max-width:420px}
#dlg h3{margin:0 0 10px;font-size:16px}#dlg p{margin:0 0 12px}
#dlg input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;margin-bottom:12px}
canvas{max-width:100%;max-height:58vh;display:block;margin:0 auto;border-radius:10px;touch-action:none;background:#ddd}
.outils{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.outil{padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:#fff;font:inherit;font-size:15px;cursor:pointer;color:var(--tx)}
.outil.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
</style></head><body>
<div id="app"><div id="vue" style="display:contents"></div><div id="toast"></div><div id="dlg"></div></div>
<script>
"use strict";
var VERSION="0.1";
var TYPES=["LED","LCD","Mur d'images","Vitrine","Totem","Audio"];
var LISTES={
 acces:["Plain-pied","Ascenseur","Escalier","Stationnement proche","Rue piétonne","Nacelle à prévoir","Porte < 90 cm"],
 contraintes:["ERP","Copropriété","Bâtiment classé","Centre commercial","Travaux en cours"],
 support:["Béton","Placo","Brique","Vitrage","Plafond","Structure à créer"],
 lumi:["Intérieur","Vitrine à l'ombre","Vitrine plein soleil","Extérieur"],
 elec:["Prise à moins de 2 m","Prise à tirer","Tableau accessible","Puissance à vérifier"],
 reseau:["RJ45 sur place","Wi-Fi client","4G à prévoir","Aucun"],
 existant:["Rien","Écran à démonter","Enseigne à déposer","Mobilier à déplacer"]
};
var ORANGE="#e8782a";
var VIS=[];                 // toutes les visites (sans les photos)
var E={ecran:"liste",onglet:"site",vid:null,eid:null,pid:null};
var db=null,urls={},sale=false,tSauve=null,outil="trait",pret=null,invite=null;

// ---------- utilitaires ----------
function h(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function uid(){return Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36)}
function $(id){return document.getElementById(id)}
function aujourdhui(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function dfr(iso){var m=/^(\d{4})-(\d\d)-(\d\d)/.exec(iso||"");return m?m[3]+"/"+m[2]+"/"+m[1]:""}
function slug(s){return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40)||"visite"}
function mo(n){return n<1048576?Math.max(1,Math.round(n/1024))+" Ko":(n/1048576).toFixed(1).replace(".",",")+" Mo"}
function V(){for(var i=0;i<VIS.length;i++)if(VIS[i].id===E.vid)return VIS[i];return null}
function EMP(){var v=V();if(!v)return null;for(var i=0;i<v.emps.length;i++)if(v.emps[i].id===E.eid)return v.emps[i];return null}
function PH(){var e=EMP();if(!e)return null;for(var i=0;i<e.photos.length;i++)if(e.photos[i].id===E.pid)return e.photos[i];return null}
var tToast;function toast(m,long){var t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(tToast);tToast=setTimeout(function(){t.style.display="none"},long?6000:2600)}

// ---------- mémoire du téléphone (IndexedDB) ----------
function idbOuvrir(){return new Promise(function(res,rej){var r=indexedDB.open("previsite",1);
 r.onupgradeneeded=function(){var d=r.result;d.createObjectStore("visites",{keyPath:"id"});d.createObjectStore("photos",{keyPath:"id"})};
 r.onsuccess=function(){db=r.result;res()};r.onerror=function(){rej(r.error)}})}
function tx(magasin,mode,fn){return new Promise(function(res,rej){var t=db.transaction(magasin,mode),rq=fn(t.objectStore(magasin));
 t.oncomplete=function(){res(rq?rq.result:undefined)};t.onerror=t.onabort=function(){rej(t.error||new Error("transaction annulée"))}})}
function sauverVisite(v){return tx("visites","readwrite",function(s){return s.put(v)})}
function etat(m){var e=$("etat");if(e)e.textContent=m}
function sauverBientot(){var v=V();if(!v)return;v.modifie=Date.now();sale=true;pret=null;etat("…");clearTimeout(tSauve);tSauve=setTimeout(sauverMaintenant,500)}
function sauverMaintenant(){clearTimeout(tSauve);var v=V();if(!v||!sale)return Promise.resolve();sale=false;
 return sauverVisite(v).then(function(){etat("Enregistré")},function(err){sale=true;etat("NON ENREGISTRÉ");toast("Enregistrement impossible : "+(err&&err.message||err),true)})}
function urlPhoto(id){if(urls[id])return Promise.resolve(urls[id]);
 return tx("photos","readonly",function(s){return s.get(id)}).then(function(r){if(!r)return "";urls[id]=URL.createObjectURL(r.blob);return urls[id]})}

// ---------- fenêtres de saisie et de confirmation ----------
function fermerDlg(){$("dlg").style.display="none";$("dlg").innerHTML=""}
function demander(titre,valeur,cb,clavier){var d=$("dlg");
 d.innerHTML='<div class="b"><h3>'+h(titre)+'</h3><input id="dlgv" value="'+h(valeur)+'"'+(clavier?' inputmode="'+clavier+'"':'')+'><div class="ligne"><button class="gros" id="dlgn">Annuler</button><button class="gros pri" id="dlgo">OK</button></div></div>';
 d.style.display="flex";var i=$("dlgv");i.focus();i.select();
 $("dlgn").onclick=fermerDlg;$("dlgo").onclick=function(){var x=i.value.trim();fermerDlg();cb(x)};
 i.onkeydown=function(ev){if(ev.key==="Enter")$("dlgo").onclick()}}
function confirmer(msg,libelle,cb){var d=$("dlg");
 d.innerHTML='<div class="b"><p>'+h(msg)+'</p><div class="ligne"><button class="gros" id="dlgn">Annuler</button><button class="gros dan" id="dlgo">'+h(libelle)+'</button></div></div>';
 d.style.display="flex";$("dlgn").onclick=fermerDlg;$("dlgo").onclick=function(){fermerDlg();cb()}}

// ---------- navigation (le bouton Retour d Android revient à l écran précédent) ----------
function aller(p){sauverMaintenant();E=Object.assign({},E,p);history.pushState(E,"");dessiner()}
function onglet(o){sauverMaintenant();E=Object.assign({},E,{onglet:o});history.replaceState(E,"");dessiner()}
function retour(){history.back()}
window.onpopstate=function(ev){sauverMaintenant();fermerDlg();if(ev.state){E=ev.state;dessiner()}};

// ---------- liste de contrôle d un emplacement ----------
function points(e){var p=[["Type",!!e.type],["Photo",e.photos.length>0],["Largeur",!!e.larg],["Hauteur",!!e.haut],["Support",e.support.length>0],["Électricité",e.elec.length>0],["Réseau",e.reseau.length>0],["Existant",e.existant.length>0]];
 if(e.type!=="Audio")p.push(["Hauteur de pose",!!e.hpose],["Distance de vision",!!e.dvision],["Luminosité",e.lumi.length>0]);
 return p}
function fait(e){return points(e).filter(function(x){return x[1]}).length}
function manques(e){return points(e).filter(function(x){return !x[1]}).map(function(x){return x[0].toLowerCase()})}
function statut(v){if(!v.exporteLe)return["w","À exporter"];if(v.exporteLe>=(v.modifie||0))return["ok","Exportée le "+dfr(new Date(v.exporteLe).toISOString())];return["w","Modifiée depuis l'export"]}

// ---------- briques de formulaire ----------
function champ(o,k,label,x,extra){return '<div class="ch"><label>'+label+'</label><input data-o="'+o+'" data-k="'+k+'" value="'+h(x[k])+'" oninput="maj(this)" '+(extra||"")+'></div>'}
function zone(o,k,label,x,rows){var id="z_"+o+"_"+k;return '<div class="ch"><label>'+label+'<button class="mic" onclick="dicter(this,\''+id+'\')">🎤 Dicter</button></label><textarea id="'+id+'" data-o="'+o+'" data-k="'+k+'" rows="'+(rows||3)+'" oninput="maj(this)">'+h(x[k])+'</textarea></div>'}
function puces(o,k,label,liste,x,seul){var val=x[k];return '<div class="ch"><label>'+label+'</label><div class="puces">'+liste.map(function(p){var on=seul?val===p:(val||[]).indexOf(p)>=0;
 return '<button class="puce'+(on?" on":"")+'" data-o="'+o+'" data-k="'+k+'" data-v="'+h(p)+'"'+(seul?' data-seul="1"':'')+' onclick="puce(this)">'+h(p)+'</button>'}).join("")+'</div></div>'}
function cible(o){return o==="v"?V():EMP()}
function maj(el){var x=cible(el.dataset.o);if(!x)return;x[el.dataset.k]=el.value;sauverBientot();compteur()}
function puce(el){var x=cible(el.dataset.o);if(!x)return;var k=el.dataset.k,v=el.dataset.v;
 if(el.dataset.seul){x[k]=x[k]===v?"":v;sauverBientot();dessiner();return}
 var a=x[k]||(x[k]=[]),i=a.indexOf(v);if(i>=0)a.splice(i,1);else a.push(v);el.classList.toggle("on",i<0);sauverBientot();compteur()}
function compteur(){var c=$("cpt"),e=EMP();if(c&&e){var p=points(e),f=fait(e);c.textContent=f+" / "+p.length;c.className="tag "+(f===p.length?"ok":"w")}}

// ---------- dictée ----------
var recEnCours=null;
function dicter(btn,id){var R=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(recEnCours){recEnCours.stop();return}
 if(!R){toast("Dictée indisponible ici : utilisez le micro du clavier.");return}
 var z=$(id),r=new R();r.lang="fr-FR";r.interimResults=false;r.continuous=true;recEnCours=r;btn.classList.add("on");btn.textContent="■ Arrêter";
 r.onresult=function(ev){var t="";for(var i=ev.resultIndex;i<ev.results.length;i++)if(ev.results[i].isFinal)t+=ev.results[i][0].transcript;
  if(t){z.value=(z.value?z.value.replace(/\s+$/,"")+" ":"")+t.trim();maj(z)}};
 r.onerror=function(ev){if(ev.error!=="aborted"&&ev.error!=="no-speech")toast("Dictée impossible ("+ev.error+") : utilisez le micro du clavier.")};
 r.onend=function(){recEnCours=null;btn.classList.remove("on");btn.textContent="🎤 Dicter"};
 try{r.start()}catch(e){recEnCours=null;btn.classList.remove("on");btn.textContent="🎤 Dicter"}}

// ---------- visites et emplacements ----------
function nouvelleVisite(){var v={id:uid(),format:1,client:"",date:aujourdhui(),adresse:"",gps:null,contact:"",tel:"",horaires:"",acces:[],contraintes:[],notes:"",emps:[],cree:Date.now(),modifie:Date.now(),exporteLe:0};
 VIS.push(v);sauverVisite(v).then(function(){aller({ecran:"visite",onglet:"site",vid:v.id})},function(err){toast("Création impossible : "+(err&&err.message||err),true)})}
function nouvelEmp(){var v=V();demander("Nom de l'emplacement","",function(nom){if(!nom)return;
 var e={id:uid(),nom:nom,type:"",larg:"",haut:"",prof:"",hpose:"",dvision:"",support:[],lumi:[],elec:[],reseau:[],existant:[],notes:"",noteInterne:"",photos:[]};
 v.emps.push(e);sauverBientot();aller({ecran:"emp",eid:e.id})})}
function supprimerPhotos(ids){if(!ids.length)return Promise.resolve();ids.forEach(function(id){if(urls[id]){URL.revokeObjectURL(urls[id]);delete urls[id]}});
 return tx("photos","readwrite",function(s){ids.forEach(function(id){s.delete(id)})})}
function supprimerEmp(){var v=V(),e=EMP();confirmer("Supprimer l'emplacement « "+e.nom+" » et ses "+e.photos.length+" photo(s) ? C'est définitif.","Supprimer",function(){
 supprimerPhotos(e.photos.map(function(p){return p.id})).then(function(){v.emps.splice(v.emps.indexOf(e),1);sauverBientot();retour()})})}
function supprimerVisite(){var v=V(),s=statut(v),n=0;v.emps.forEach(function(e){n+=e.photos.length});
 confirmer((s[0]==="ok"?"":"ATTENTION : cette visite n'a pas été exportée dans son dernier état. ")+"Supprimer la visite « "+(v.client||"sans nom")+" » et ses "+n+" photo(s) ? C'est définitif.","Supprimer",function(){
 var ids=[];v.emps.forEach(function(e){e.photos.forEach(function(p){ids.push(p.id)})});sale=false;clearTimeout(tSauve);
 supprimerPhotos(ids).then(function(){return tx("visites","readwrite",function(st){return st.delete(v.id)})}).then(function(){VIS.splice(VIS.indexOf(v),1);retour()},function(err){toast("Suppression impossible : "+(err&&err.message||err),true)})})}
function gps(){if(!navigator.geolocation){toast("Position indisponible sur cet appareil.");return}toast("Recherche de la position…");
 navigator.geolocation.getCurrentPosition(function(p){var v=V();if(!v)return;v.gps={lat:+p.coords.latitude.toFixed(6),lon:+p.coords.longitude.toFixed(6),precision:Math.round(p.coords.accuracy)};sauverBientot();dessiner();toast("Position relevée (à "+v.gps.precision+" m près).")},
  function(err){toast("Position non obtenue : "+err.message)},{enableHighAccuracy:true,timeout:15000})}

// ---------- photos ----------
function reduire(fichier){return new Promise(function(res,rej){var u=URL.createObjectURL(fichier),im=new Image();
 im.onload=function(){var k=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight)),w=Math.round(im.naturalWidth*k),ht=Math.round(im.naturalHeight*k),c=document.createElement("canvas");c.width=w;c.height=ht;
  c.getContext("2d").drawImage(im,0,0,w,ht);URL.revokeObjectURL(u);c.toBlob(function(b){b?res({blob:b,w:w,h:ht}):rej(new Error("image illisible"))},"image/jpeg",0.82)};
 im.onerror=function(){URL.revokeObjectURL(u);rej(new Error("image illisible"))};im.src=u})}
function prendre(appareil){var i=document.createElement("input");i.type="file";i.accept="image/*";if(appareil)i.capture="environment";else i.multiple=true;i.style.display="none";document.body.appendChild(i);
 i.onchange=function(){var f=[].slice.call(i.files);i.remove();if(f.length)ajouterPhotos(f)};i.click()}
function ajouterPhotos(fichiers){var v=V(),e=EMP();if(!v||!e)return;var ch=Promise.resolve(),ko=0;
 fichiers.forEach(function(f){ch=ch.then(function(){return reduire(f).then(function(r){var id=uid();
   return tx("photos","readwrite",function(s){return s.put({id:id,blob:r.blob,w:r.w,h:r.h})}).then(function(){e.photos.push({id:id,legende:"",w:r.w,h:r.h,ann:[]})})}).catch(function(){ko++})})});
 ch.then(function(){v.modifie=Date.now();pret=null;return sauverVisite(v)}).then(function(){if(ko)toast(ko+" photo(s) non enregistrée(s) : mémoire pleine ou image illisible.",true);dessiner()},function(err){toast("Enregistrement impossible : "+(err&&err.message||err),true)})}
function supprimerPhoto(){var e=EMP(),p=PH();confirmer("Supprimer cette photo ? C'est définitif.","Supprimer",function(){supprimerPhotos([p.id]).then(function(){e.photos.splice(e.photos.indexOf(p),1);sauverBientot();retour()})})}

// ---------- annotation ----------
function chemin(g,pts){g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(var i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1])}
function trait2(g,pts,u){g.lineCap=g.lineJoin="round";chemin(g,pts);g.strokeStyle="#fff";g.lineWidth=u*2.2;g.stroke();chemin(g,pts);g.strokeStyle=ORANGE;g.lineWidth=u*1.3;g.stroke()}
function etiquette(g,txt,x,y,u){if(!txt)return;g.font="bold "+Math.round(u*7)+"px sans-serif";var w=g.measureText(txt).width,p=u*2.2,ht=u*10;
 x=Math.max(w/2+p,Math.min(g.canvas.width-w/2-p,x));y=Math.max(ht/2,Math.min(g.canvas.height-ht/2,y));
 g.fillStyle="rgba(31,35,40,.88)";g.fillRect(x-w/2-p,y-ht/2,w+2*p,ht);g.fillStyle="#fff";g.textAlign="center";g.textBaseline="middle";g.fillText(txt,x,y)}
function tracer(g,a,u){
 if(a.t==="trait"){trait2(g,a.pts,u)}
 else if(a.t==="cote"){var dx=a.b[0]-a.a[0],dy=a.b[1]-a.a[1],L=Math.sqrt(dx*dx+dy*dy)||1,nx=-dy/L*u*4,ny=dx/L*u*4;
  trait2(g,[a.a,a.b],u);trait2(g,[[a.a[0]-nx,a.a[1]-ny],[a.a[0]+nx,a.a[1]+ny]],u);trait2(g,[[a.b[0]-nx,a.b[1]-ny],[a.b[0]+nx,a.b[1]+ny]],u);
  etiquette(g,a.txt,(a.a[0]+a.b[0])/2,(a.a[1]+a.b[1])/2,u)}
 else if(a.t==="texte"){etiquette(g,a.txt,a.p[0],a.p[1],u)}}
function peindre(g,ph,im,enCours){var u=Math.max(ph.w,ph.h)/220;g.drawImage(im,0,0,ph.w,ph.h);ph.ann.forEach(function(a){tracer(g,a,u)});if(enCours)tracer(g,enCours,u)}

var CRCT=(function(){var t=new Uint32Array(256);for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

 var enc=new TextEncoder(),parts=[],central=[],pos=0;
 fichiers.forEach(function(f){var nom=enc.encode(f.nom),crc=crc32(f.data),L=new DataView(new ArrayBuffer(30));
  L.setUint32(0,0x04034b50,true);L.setUint16(4,20,true);L.setUint16(6,0x0800,true);L.setUint16(8,0,true);L.setUint16(10,heure,true);L.setUint16(12,jour,true);
  L.setUint32(14,crc,true);L.setUint32(18,f.data.length,true);L.setUint32(22,f.data.length,true);L.setUint16(26,nom.length,true);L.setUint16(28,0,true);
  var C=new DataView(new ArrayBuffer(46));
  C.setUint32(0,0x02014b50,true);C.setUint16(4,20,true);C.setUint16(6,20,true);C.setUint16(8,0x0800,true);C.setUint16(10,0,true);C.setUint16(12,heure,true);C.setUint16(14,jour,true);
  C.setUint32(16,crc,true);C.setUint32(20,f.data.length,true);C.setUint32(24,f.data.length,true);C.setUint16(28,nom.length,true);C.setUint32(42,pos,true);
  parts.push(new Uint8Array(L.buffer),nom,f.data);central.push(new Uint8Array(C.buffer),nom);pos+=30+nom.length+f.data.length});
 var tc=0;central.forEach(function(c){tc+=c.length});var F=new DataView(new ArrayBuffer(22));
 F.setUint32(0,0x06054b50,true);F.setUint16(8,fichiers.length,true);F.setUint16(10,fichiers.length,true);F.setUint32(12,tc,true);F.setUint32(16,pos,true);
 return new Blob(parts.concat(central,[new Uint8Array(F.buffer)]),{type:"application/zip"})}

  e.photos.forEach(function(p){ch=ch.then(function(){return tx("photos","readonly",function(s){return s.get(p.id)})}).then(function(r){if(!r)throw new Error("photo absente de la mémoire");return octets(r.blob)})
   .then(function(d){p.fichier="photos/"+p.id+".jpg";fichiers.push({nom:p.fichier,data:d});
    if(p.ann.length)return annotee(p).then(octets).then(function(d2){p.fichierAnnote="photos/"+p.id+"_annotee.jpg";fichiers.push({nom:p.fichierAnnote,data:d2})})})})});
